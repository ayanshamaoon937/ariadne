<script>
    // Hero Slider
    $(document).ready(function () {
        let slider = $('.single-item');

        // Initialize Slick slider
        slider.slick({
            dots: true,
            infinite: true,
            speed: 700,
            slidesToShow: 1,
            slidesToScroll: 1,
            arrows: true,
            prevArrow: $('.hero-btn-prev'),
            nextArrow: $('.hero-btn-next'),
            responsive: [
                {
                    breakpoint: 992,
                    settings: {
                        dots: true,
                        arrows: false
                    }
                }
            ]
        });

        // Handle responsive button visibility
        function updateArrowVisibility() {
            if (window.innerWidth < 992) {
                $('.hero-btn-prev, .hero-btn-next').hide();
            } else {
                $('.hero-btn-prev, .hero-btn-next').show();
            }
        }

        // Initial check
        updateArrowVisibility();

        // Update on window resize
        $(window).on('resize', updateArrowVisibility);

        // Map nav-pills buttons to slides
        $('.nav-pills .nav-link').each(function (index) {
            $(this).on('click', function () {
                $('.nav-pills .nav-link').removeClass('active'); // Remove active class
                $(this).addClass('active'); // Add active class to clicked button
                slider.slick('slickGoTo', index); // Go to corresponding slide
            });
        });

        // Sync active class on slide change
        slider.on('afterChange', function (event, slick, currentSlide) {
            $('.nav-pills .nav-link').removeClass('active'); // Remove active class
            $('.nav-pills .nav-link').eq(currentSlide).addClass('active'); // Add active class to correct button
        });
    });
</script>

<script>
    document.querySelectorAll(".nav-item").forEach((item) => {
        let dropdown = item.querySelector(".drop-down");
        let icon = item.querySelector(".nav-link img");

        if (dropdown) { // Ensure dropdown exists before adding event listeners
            item?.addEventListener("mouseenter", () => {
                dropdown.style.display = "block";
                if (icon) { // Ensure icon exists before modifying it
                    icon.style.transform = "rotate(180deg)";
                    icon.style.transition = "transform 0.3s ease-in-out";
                }
            });

            item?.addEventListener("mouseleave", () => {
                setTimeout(() => {
                    if (!item.matches(":hover") && !dropdown.matches(":hover")) {
                        dropdown.style.display = "none";
                        if (icon) {
                            icon.style.transform = "rotate(0deg)";
                        }
                    }
                }, 200);
            });

            dropdown?.addEventListener("mouseleave", () => {
                setTimeout(() => {
                    if (!item.matches(":hover") && !dropdown.matches(":hover")) {
                        dropdown.style.display = "none";
                        if (icon) {
                            icon.style.transform = "rotate(0deg)";
                        }
                    }
                }, 200);
            });
        }
    });
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const resourceToggle = document.querySelector('[data-bs-toggle="collapse"][href="#resourcesCollapse"]');
        const resourceCollapse = document.querySelector("#resourcesCollapse");

        if (resourceToggle && resourceCollapse) {
            const arrowIcon = resourceToggle.querySelector(".arrow-icon");

            resourceCollapse.addEventListener("show.bs.collapse", function () {
                arrowIcon.style.transform = "rotate(90deg)";
            });

            resourceCollapse.addEventListener("hide.bs.collapse", function () {
                arrowIcon.style.transform = "rotate(0deg)";
            });
        }
    });
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const cookiePopup = document.querySelector(".cookie-popup");
        const acceptBtn = document.querySelector(".btn-primary.cookie");
        const declineBtn = document.querySelector(".btn-white-outline.cookie");

        // Check if the user has already made a choice
        if (localStorage.getItem("cookieConsent")) {
            cookiePopup.style.display = "none"; // Hide the popup
        }

        function setCookieConsent(value) {
            localStorage.setItem("cookieConsent", value);
            cookiePopup.style.display = "none"; // Hide after selection
        }

        acceptBtn.addEventListener("click", function () {
            setCookieConsent("accepted");
        });

        declineBtn.addEventListener("click", function () {
            setCookieConsent("declined");
        });
    });
</script>

<script>
