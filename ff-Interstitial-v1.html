<div class="ff-Interstitial-wrapper">
    <div class="container-fluid px-0">

        <div class="row mx-0">
            <div class="col-lg-6 px-0">
                <img src="../assets-new/img/landing-product/forms-pages.png" class="img-fluid w-100 object-fit-cover">
            </div>
            <div class="col-lg-6 px-0">
                <div class="form p-4 p-lg-6">
                    <h1 class="text-white display-3 fw-bold ff-inter">Welcome</h1>
                    <p class="ff-inter fw-normal mb-4">To access this content, please let us know a few details about

                    <form action="">
                        <div class="row mx-0">
                            <div class="col-md-6 px-0 pe-lg-2  mb-3 mb-lg-4">
                                <input type="text" class="form-control form-control-lg rounded-pill ff-inter fw-normal"
                                       placeholder="First Name*">
                            </div>
                            <div class="col-md-6 px-0 ps-lg-2  mb-3 mb-lg-4">
                                <input type="text" class="form-control form-control-lg rounded-pill ff-inter fw-normal"
                                       placeholder="Last Name*">
                            </div>
                            <div class="col-lg-12 px-0 mb-3 mb-lg-4">
                                <input type="email" class="form-control form-control-lg rounded-pill ff-inter fw-normal"
                                       placeholder="Email*">
                            </div>
                            <div class="col-lg-12 px-0 mb-3 mb-lg-4">
                                <input type="text" class="form-control form-control-lg rounded-pill ff-inter fw-normal"
                                       placeholder="Last Name*">
                            </div>
                            <div class="col-lg-12 px-0 mb-3 mb-lg-4">
                                <select class="form-select form-select-lg rounded-pill ff-inter fw-normal">
                                    <option selected>Country/Region</option>
                                    <option>...</option>
                                </select>
                            </div>
                            <div class="col-lg-12 px-0 mb-3 mb-lg-4">
                                <select class="form-select form-select-lg rounded-pill ff-inter fw-normal">
                                    <option selected>Industry</option>
                                    <option>...</option>
                                </select>
                            </div>
                            <div class="col-lg-12 px-0 mb-3 mb-lg-4">
                                <select class="form-select form-select-lg rounded-pill ff-inter fw-normal">
                                    <option selected>Area of Reasearch</option>
                                    <option>...</option>
                                </select>
                            </div>
                            <div class="col-lg-12 px-0 mb-3 mb-lg-4">
                                <input type="text" class="form-control form-control-lg rounded-pill ff-inter fw-normal"
                                       placeholder="How can we help you?">
                            </div>
                            <div class="col-lg-12 px-0 mb-1">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox">
                                    <label class="form-check-label">
                                        I would like to receive newsletter.
                                    </label>
                                </div>
                            </div>
                            <div class="col-lg-12 px-0 mb-lg-5">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox">
                                    <label class="form-check-label ff-inter">
                                        I agree with <a class="text-primary ff-inter" href="">Terms of Use</a> and <a
                                            class="text-primary ff-inter" href="">Privacy Policy.</a>
                                    </label>
                                </div>
                            </div>
                            <button target="_blank" href="https://www.clay.com/"
                                    class="btn btn-white py-2 px-4 ff-inter d-flex align-items-center justify-content-center border-0 position-relative gap-2 rounded-7 overflow-hidden"
                                    type="submit">
                                <span class="circle rounded-circle position-absolute"></span>
                                <span class="z-2 text position-relative py-1">Submit</span>
                                <span class="z-2 position-relative"><img
                                        src="../assets-new/icons/right-chev.svg"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
